name: Magnevents Continuous Integration & Testing

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test-booking-platform:
    name: Booking Platform Tests & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: booking-platform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --prefer-offline

      - name: Run Automated Test Suites (Diwali Offer, Payment, Security)
        run: npm test

  test-admin-portal:
    name: Admin Portal Tests & Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-portal

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --prefer-offline

      - name: Run Admin Campaign Management Test Suite
        run: npm test

  security-scan:
    name: Dependency & Secret Exposure Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Scan Repository For Active Secrets
        run: |
          python -c "
          import os, sys
          print('Scanning repository for sensitive credential leaks...')
          clean = True
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['node_modules', '.next', '.git']]
              for f in files:
                  if f.endswith(('.js', '.jsx', '.ts', '.tsx', '.json', '.html')):
                      p = os.path.join(root, f)
                      try:
                          with open(p, 'r', errors='ignore') as fh:
                              content = fh.read()
                              if 'sk_live_' in content and 'REPLACE_WITH' not in content:
                                  print(f'Warning: Potential live secret pattern in {p}')
                                  clean = False
                      except Exception:
                          pass
          if not clean:
              sys.exit(1)
          print('Security scan completed: No active live keys found in source code.')
          "
